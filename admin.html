<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d2215" />
<title>Admin | Mountain Travels</title>
<link rel="icon" href="Mountain.png" type="image/png" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--dark:#0d2215;--green:#143522;--tint:#edf7f0;--gold:#e5a408;--blue:#3d80b4;--bg:#f4f7f5;--line:#e2e8f0;--mut:#55695d;--red:#dc2626;--ok:#15803d;--white:#fff;
--hd:'Cinzel',Georgia,serif;--bd:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--bd);background:var(--bg);color:var(--dark);font-size:.9rem;line-height:1.5}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:linear-gradient(160deg,var(--dark),var(--green))}
.login-card{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:2rem 1.5rem;border-top:4px solid var(--gold);box-shadow:0 20px 45px rgba(0,0,0,.4)}
.login-card h1{font-family:var(--hd);color:var(--green);font-size:1.3rem;text-align:center;margin:.4rem 0 .2rem}
.login-card p.sub{text-align:center;color:var(--mut);font-size:.8rem;margin-bottom:1.25rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.85rem}
.field label{font-size:.74rem;font-weight:700;text-transform:uppercase}
.field input,.field select{height:44px;padding:0 .85rem;border:1.5px solid #cbe0f0;border-radius:8px;font:inherit;background:#fbfdff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:42px;padding:0 1.1rem;border:none;border-radius:8px;background:#1F7A3D;color:#fff;font-weight:700;font-size:.85rem}
.btn:hover{background:var(--green)}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.sm{height:34px;padding:0 .8rem;font-size:.78rem}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.danger:hover{background:#fef2f2}
.btn:disabled{opacity:.6;cursor:wait}
.logo-box{background:var(--dark);border-radius:12px;padding:.6rem;display:flex;justify-content:center;margin-bottom:.9rem}
.logo-img{height:64px;width:auto;max-width:100%;object-fit:contain;mix-blend-mode:screen}
.side .brand{padding:.1rem .4rem 1rem}
.side .logo-img{height:48px}
.msg{display:none;font-size:.78rem;font-weight:600;padding:.5rem .7rem;border-radius:6px;margin-bottom:.85rem;color:var(--red);background:#fef2f2;border:1px solid #fecaca}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--dark);color:#cbdad1;padding:1.25rem .9rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh;border-right:2px solid var(--gold)}
.side .brand{font-family:var(--hd);color:#fff;font-size:1.05rem;padding:.25rem .6rem 1rem;display:flex;align-items:center;gap:.5rem}
.side .brand i{color:var(--gold)}
.nav{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:8px;background:none;border:none;color:inherit;font-weight:600;font-size:.86rem;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--gold);color:var(--dark)}
.nav i{width:18px;text-align:center}
.side .spacer{flex:1}
.main{flex:1;min-width:0;padding:1.5rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.top h2{font-family:var(--hd);font-size:1.4rem;color:var(--green)}
.who{font-size:.78rem;color:var(--mut)}
.tabbar{display:none}
@media(max-width:860px){
 .side{display:none}
 .main{padding:1rem 1rem 5.5rem}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--dark);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0)}
 .tabbar button{flex:1;background:none;border:none;color:#9cb5a5;padding:.55rem 0;font-size:.65rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:.2rem}
 .tabbar button i{font-size:1.05rem}
 .tabbar button.on{color:var(--gold)}
}

/* CARDS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-bottom:1.25rem}
@media(min-width:860px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:1rem}
.stat .n{font-family:var(--hd);font-size:1.7rem;color:var(--green);line-height:1.1}
.stat .l{font-size:.76rem;color:var(--mut);margin-top:.2rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.1rem;margin-bottom:1rem}
.panel h3{font-size:.95rem;margin-bottom:.7rem}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem}
.links a{display:flex;align-items:center;gap:.6rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--green);font-weight:600;font-size:.82rem}
.links a:hover{background:var(--tint)}

.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{padding:.4rem .9rem;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.78rem;font-weight:700;color:#334155}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.rev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:.8rem}
.rev-h{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:flex-start}
.rev-n{font-weight:700}
.rev-d{font-size:.72rem;color:var(--mut)}
.stars{color:#fbbc04;font-size:.8rem;margin:.25rem 0}
.stars .off{color:#d5dbe3}
.rev p{font-size:.84rem;color:#334155;margin:.4rem 0 .8rem;word-break:break-word}
.rev-a{display:flex;gap:.5rem;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;padding:.18rem .55rem;border-radius:999px}
.badge.pend{background:#fef3c7;color:#92400e}
.badge.live{background:#dcfce7;color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:2rem 1rem;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;font-size:.84rem}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.8rem}
th,td{padding:.65rem .8rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
th{background:var(--tint);font-size:.72rem;text-transform:uppercase;color:var(--green)}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--dark);color:#fff;padding:.6rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;z-index:99;border-left:3px solid var(--gold);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <div class="logo-box"><img src="Mountain.png" alt="Mountain Travels" class="logo-img"></div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in with your admin mobile number.</p>
    <div class="msg" id="loginErr" role="alert"></div>
    <div class="field"><label for="email">Mobile number</label><input id="email" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="username" required></div>
    <div class="field"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <button class="btn full" id="loginBtn" type="submit"><i class="fa-solid fa-lock"></i> Sign in</button>
  </form>
</div>

<!-- APP -->
<div class="app hidden" id="appView">
  <aside class="side">
    <div class="brand"><img src="Mountain.png" alt="Mountain Travels" class="logo-img"></div>
    <button class="nav on" data-tab="overview"><i class="fa-solid fa-gauge"></i> Overview</button>
    <button class="nav" data-tab="reviews"><i class="fa-solid fa-star"></i> Reviews</button>
    <button class="nav" data-tab="bookings"><i class="fa-solid fa-calendar-check"></i> Bookings</button>
    <button class="nav" data-tab="customers"><i class="fa-solid fa-users"></i> Customers</button>
    <div class="spacer"></div>
    <a class="nav" href="index.html" style="text-decoration:none"><i class="fa-solid fa-arrow-up-right-from-square"></i> View website</a>
    <button class="nav" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
  </aside>

  <main class="main">
    <div class="top">
      <h2 id="pageTitle">Overview</h2>
      <div class="who" id="who"></div>
    </div>

    <section id="tab-overview">
      <div class="stats">
        <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total reviews</div></div>
        <div class="stat"><div class="n" id="sPending">0</div><div class="l">Waiting for approval</div></div>
        <div class="stat"><div class="n" id="sAvg">-</div><div class="l">Average rating (live)</div></div>
        <div class="stat"><div class="n" id="sBook">0</div><div class="l">Bookings saved</div></div>
      </div>
      <div class="panel">
        <h3>Quick actions</h3>
        <div class="links">
          <a href="tel:+919360543120"><i class="fa-solid fa-phone"></i> Call dispatcher</a>
          <a href="https://wa.me/919360543120" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i> Open WhatsApp</a>
          <a href="mailto:reservations.mountaintravels@gmail.com"><i class="fa-solid fa-envelope"></i> Email bookings desk</a>
          <a href="index.html#reserve"><i class="fa-solid fa-car-side"></i> Booking form</a>
          <a href="index.html#reviews"><i class="fa-solid fa-comments"></i> Reviews on site</a>
          <a href="https://console.firebase.google.com/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-fire"></i> Firebase console</a>
        </div>
      </div>
    </section>

    <section id="tab-reviews" class="hidden">
      <div class="toolbar" id="revFilters">
        <button class="chip on" data-f="pending">Pending</button>
        <button class="chip" data-f="live">Approved</button>
        <button class="chip" data-f="all">All</button>
      </div>
      <div id="revList"></div>
    </section>

    <section id="tab-bookings" class="hidden">
      <div class="toolbar"><button class="btn ghost sm" id="csvBookings"><i class="fa-solid fa-download"></i> Export CSV</button></div>
      <div id="bookList"></div>
    </section>

    <section id="tab-customers" class="hidden">
      <div class="toolbar"><button class="btn ghost sm" id="csvCustomers"><i class="fa-solid fa-download"></i> Export CSV</button></div>
      <div id="custList"></div>
    </section>
  </main>
</div>

<nav class="tabbar hidden" id="tabbar" aria-label="Admin navigation">
  <button class="on" data-tab="overview"><i class="fa-solid fa-gauge"></i>Overview</button>
  <button data-tab="reviews"><i class="fa-solid fa-star"></i>Reviews</button>
  <button data-tab="bookings"><i class="fa-solid fa-calendar-check"></i>Bookings</button>
  <button data-tab="customers"><i class="fa-solid fa-users"></i>Customers</button>
  <button id="logoutBtn2"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script>
(function () {
  'use strict';

  /* ===== SETTINGS ===== */
  // 1) Paste the SAME Firebase web config that is inside your script.js
  var FIREBASE_CONFIG = {
    apiKey: 'PASTE_API_KEY',
    authDomain: 'PASTE_PROJECT.firebaseapp.com',
    projectId: 'PASTE_PROJECT_ID',
    appId: 'PASTE_APP_ID'
  };
  // 2) Only these mobile numbers can use the admin (also enforce this in Firestore rules)
  var ADMIN_PHONES = ['9360543120'];
  var LOGIN_DOMAIN = '@admin.mountaintravels.in'; // Firebase user email = mobile + this
  // 3) Firestore collection names. Bookings/customers show once your site saves to them.
  var COL = { reviews: 'reviews', bookings: 'bookings', customers: 'users' };

  /* ===== SETUP ===== */
  var $ = function (id) { return document.getElementById(id); };
  var db, auth, unsubs = [];
  var reviews = [], bookings = [], customers = [], filter = 'pending';

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  var toastT;
  function toast(m) {
    var t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function fmtDate(v) {
    if (v && typeof v.toDate === 'function') v = v.toDate();
    if (!(v instanceof Date)) return '';
    return v.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  /* ===== LOGIN ===== */
  function loginErr(m) { var b = $('loginErr'); b.textContent = m; b.style.display = m ? 'block' : 'none'; }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var phone = $('email').value.replace(/\D/g, ''), pass = $('pass').value;
    if (!/^[6-9][0-9]{9}$/.test(phone)) { loginErr('Enter a valid 10-digit mobile number.'); return; }
    if (!pass) { loginErr('Enter your password.'); return; }
    var email = phone + LOGIN_DOMAIN;
    loginErr('');
    var btn = $('loginBtn'); btn.disabled = true;
    auth.signInWithEmailAndPassword(email, pass).catch(function (err) {
      var bad = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'];
      loginErr(bad.indexOf(err.code) > -1 ? 'Mobile number or password is incorrect.' : 'Sign in failed: ' + (err.code || err.message));
    }).then(function () { btn.disabled = false; });
  });

  function signOut() { auth.signOut(); }
  $('logoutBtn').addEventListener('click', signOut);
  $('logoutBtn2').addEventListener('click', signOut);

  auth.onAuthStateChanged(function (user) {
    unsubs.forEach(function (u) { u(); }); unsubs = [];
    var phoneId = user && user.email ? user.email.split('@')[0] : '';
    var allowed = user && user.email && user.email.toLowerCase().slice(-LOGIN_DOMAIN.length) === LOGIN_DOMAIN && ADMIN_PHONES.indexOf(phoneId) > -1;
    if (user && !allowed) {
      auth.signOut(); loginErr('This account does not have admin access.'); return;
    }
    $('loginView').classList.toggle('hidden', !!user);
    $('appView').classList.toggle('hidden', !user);
    $('tabbar').classList.toggle('hidden', !user);
    if (user) { $('who').textContent = '+91 ' + phoneId; startListeners(); }
  });

  /* ===== TABS ===== */
  var TITLES = { overview: 'Overview', reviews: 'Reviews', bookings: 'Bookings', customers: 'Customers' };
  function showTab(name) {
    ['overview', 'reviews', 'bookings', 'customers'].forEach(function (t) {
      $('tab-' + t).classList.toggle('hidden', t !== name);
    });
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); });
    $('pageTitle').textContent = TITLES[name];
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
  });

  /* ===== LIVE DATA ===== */
  function listen(name, cb) {
    var u = db.collection(COL[name]).limit(300).onSnapshot(function (snap) {
      var rows = [];
      snap.forEach(function (d) { var o = d.data(); o.id = d.id; rows.push(o); });
      rows.sort(function (a, b) { return time(b) - time(a); });
      cb(rows);
    }, function (err) {
      console.warn('[Admin] ' + name + ':', err.code || err.message);
      if (name === 'reviews') toast('Cannot read reviews: ' + (err.code || err.message));
      cb([]);
    });
    unsubs.push(u);
  }
  function time(o) {
    var v = o.createdAt || o.timestamp;
    return v && typeof v.toDate === 'function' ? v.toDate().getTime() : 0;
  }

  function startListeners() {
    listen('reviews', function (r) { reviews = r; renderReviews(); renderStats(); });
    listen('bookings', function (r) { bookings = r; renderTable($('bookList'), r, 'No bookings saved yet. Your site currently sends bookings to WhatsApp.'); renderStats(); });
    listen('customers', function (r) { customers = r; renderTable($('custList'), r, 'No registered customers found.'); });
  }

  function renderStats() {
    var live = reviews.filter(function (r) { return r.approved === true; });
    $('sTotal').textContent = reviews.length;
    $('sPending').textContent = reviews.length - live.length;
    $('sBook').textContent = bookings.length;
    var avg = live.length ? live.reduce(function (s, r) { return s + (r.rating || 0); }, 0) / live.length : 0;
    $('sAvg').textContent = live.length ? avg.toFixed(1) : '-';
  }

  /* ===== REVIEWS ===== */
  document.querySelectorAll('#revFilters .chip').forEach(function (c) {
    c.addEventListener('click', function () {
      filter = c.getAttribute('data-f');
      document.querySelectorAll('#revFilters .chip').forEach(function (x) { x.classList.toggle('on', x === c); });
      renderReviews();
    });
  });

  function renderReviews() {
    var box = $('revList'); clear(box);
    var rows = reviews.filter(function (r) {
      return filter === 'all' || (filter === 'live' ? r.approved === true : r.approved !== true);
    });
    if (!rows.length) {
      box.appendChild(el('div', 'empty', filter === 'pending' ? 'No reviews waiting for approval.' : 'No reviews here yet.'));
      return;
    }
    rows.forEach(function (r) {
      var card = el('article', 'rev');
      var h = el('div', 'rev-h');
      var left = el('div');
      left.appendChild(el('div', 'rev-n', r.name || 'Anonymous'));
      left.appendChild(el('div', 'rev-d', fmtDate(r.createdAt)));
      h.appendChild(left);
      h.appendChild(el('span', 'badge ' + (r.approved ? 'live' : 'pend'), r.approved ? 'Live on site' : 'Pending'));
      card.appendChild(h);

      var stars = el('div', 'stars'); stars.setAttribute('role', 'img'); stars.setAttribute('aria-label', (r.rating || 0) + ' out of 5');
      for (var i = 1; i <= 5; i++) {
        var s = el('i', 'fa-solid fa-star' + (i <= r.rating ? '' : ' off')); s.setAttribute('aria-hidden', 'true'); stars.appendChild(s);
      }
      card.appendChild(stars);
      card.appendChild(el('p', null, r.text || ''));

      var a = el('div', 'rev-a');
      var tog = el('button', 'btn sm' + (r.approved ? ' ghost' : ''));
      tog.type = 'button';
      tog.innerHTML = r.approved ? '<i class="fa-solid fa-eye-slash"></i> Hide from site' : '<i class="fa-solid fa-check"></i> Approve';
      tog.addEventListener('click', function () {
        tog.disabled = true;
        db.collection(COL.reviews).doc(r.id).update({ approved: !r.approved })
          .then(function () { toast(r.approved ? 'Review hidden' : 'Review approved'); })
          .catch(function (e) { toast('Failed: ' + (e.code || e.message)); tog.disabled = false; });
      });
      var del = el('button', 'btn sm danger'); del.type = 'button';
      del.innerHTML = '<i class="fa-solid fa-trash"></i> Delete';
      del.addEventListener('click', function () {
        if (!confirm('Delete this review permanently?')) return;
        db.collection(COL.reviews).doc(r.id).delete()
          .then(function () { toast('Review deleted'); })
          .catch(function (e) { toast('Failed: ' + (e.code || e.message)); });
      });
      a.appendChild(tog); a.appendChild(del);
      card.appendChild(a);
      box.appendChild(card);
    });
  }

  /* ===== GENERIC TABLES + CSV ===== */
  function cols(rows) {
    var set = {};
    rows.forEach(function (r) { Object.keys(r).forEach(function (k) { if (k !== 'id') set[k] = 1; }); });
    return Object.keys(set);
  }
  function cell(v) {
    if (v && typeof v.toDate === 'function') return fmtDate(v);
    if (v === null || v === undefined) return '';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }
  function renderTable(box, rows, emptyMsg) {
    clear(box);
    if (!rows.length) { box.appendChild(el('div', 'empty', emptyMsg)); return; }
    var c = cols(rows);
    var wrap = el('div', 'tw'), t = el('table'), thead = el('thead'), hr = el('tr');
    c.forEach(function (k) { hr.appendChild(el('th', null, k)); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var tr = el('tr');
      c.forEach(function (k) { var td = el('td', null, cell(r[k])); td.title = cell(r[k]); tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); box.appendChild(wrap);
  }
  function exportCsv(rows, name) {
    if (!rows.length) { toast('Nothing to export'); return; }
    var c = cols(rows);
    var esc = function (v) { v = cell(v).replace(/"/g, '""'); return /^[=+\-@]/.test(v) ? '"\'' + v + '"' : '"' + v + '"'; };
    var lines = [c.map(esc).join(',')].concat(rows.map(function (r) { return c.map(function (k) { return esc(r[k]); }).join(','); }));
    var blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  $('csvBookings').addEventListener('click', function () { exportCsv(bookings, 'bookings'); });
  $('csvCustomers').addEventListener('click', function () { exportCsv(customers, 'customers'); });
})();
</script>
</body>
